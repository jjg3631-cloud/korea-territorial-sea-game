const targetPaths=[[[122,166],[108,195],[98,218],[106,242],[125,278],[145,312],[150,335],[140,356],[115,380],[90,405],[70,425],[58,455],[50,485],[49,505],[60,520],[85,532],[120,540],[160,545]],[[160,545],[164,568],[148,585],[148,603],[158,620],[178,630],[205,628],[235,620],[260,600],[270,575],[260,550],[240,540],[215,536],[250,533],[290,529],[320,523],[345,512],[370,495],[395,475],[412,455],[415,435],[430,415],[445,390],[460,365],[475,340],[485,310],[492,280],[498,250],[497,225],[488,195],[475,165],[455,125],[435,85],[418,45],[405,0]]];
const img=document.getElementById('map'); img.src='data:image/png;base64,'+imgData;
const canvas=document.getElementById('draw'),ctx=canvas.getContext('2d');
let strokes=[],current=null,scored=false;
function setup(){const r=canvas.getBoundingClientRect();const dpr=window.devicePixelRatio||1;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);redraw()}
function redraw(){ctx.clearRect(0,0,W,H);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#d22c20';ctx.lineWidth=3.1;
for(const s of strokes){if(s.length<2)continue;ctx.beginPath();ctx.moveTo(s[0][0],s[0][1]);for(let i=1;i<s.length;i++)ctx.lineTo(s[i][0],s[i][1]);ctx.stroke()}
if(current&&current.length>1){ctx.beginPath();ctx.moveTo(current[0][0],current[0][1]);for(let i=1;i<current.length;i++)ctx.lineTo(current[i][0],current[i][1]);ctx.stroke()}}
function point(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(W,(e.clientX-r.left)*W/r.width)),Math.max(0,Math.min(H,(e.clientY-r.top)*H/r.height))]}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);current=[point(e)];scored=false;document.getElementById('score').textContent='--%';document.getElementById('fill').style.width='0%';document.getElementById('msg').textContent='계속 그려 보세요. 정확도 계산 중…';redraw();calculateScore()});
canvas.addEventListener('pointermove',e=>{if(!current)return;e.preventDefault();const p=point(e),last=current[current.length-1];if(Math.hypot(p[0]-last[0],p[1]-last[1])>1.4){current.push(p);redraw();calculateScore()}});
function finish(){if(current){if(current.length>1)strokes.push(current);current=null;redraw();calculateScore()}}
canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
function sample(paths,step=2){let pts=[];for(const path of paths){for(let i=1;i<path.length;i++){let a=path[i-1],b=path[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(d/step));for(let j=0;j<=n;j++){let t=j/n;pts.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}}return pts}
function pointLineDist(p,a,b){let dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;if(!l)return Math.hypot(p[0]-a[0],p[1]-a[1]);let t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l));return Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy))}
function minDist(p,segments){let m=1e9;for(const [a,b] of segments){let d=pointLineDist(p,a,b);if(d<m)m=d}return m}
function calculateScore(){
let active=[...strokes];if(current&&current.length>1)active.push(current);
let drawn=[];for(const s of active)for(let i=1;i<s.length;i++)drawn.push([s[i-1],s[i]]);
if(drawn.length===0){document.getElementById('score').textContent='--%';document.getElementById('fill').style.width='0%';return}
let ref=sample(targetPaths,2),tol=13;
let recall=ref.filter(p=>minDist(p,drawn)<=tol).length/ref.length;
let userPts=[];for(const s of active){for(let i=0;i<s.length;i+=2)userPts.push(s[i]);if(s.length)userPts.push(s[s.length-1])}
let targetSegments=targetPaths.flatMap(path=>path.slice(1).map((b,i)=>[path[i],b]));
let precision=userPts.filter(p=>minDist(p,targetSegments)<=tol).length/Math.max(1,userPts.length);
let f=precision+recall===0?0:2*precision*recall/(precision+recall);
let value=Math.round(Math.max(0,Math.min(100,f*100)));
document.getElementById('score').textContent=value+'%';document.getElementById('fill').style.width=value+'%';
let msg=value>=90?'대단해요! 영해선의 위치를 거의 완벽하게 찾고 있어요!':value>=75?'훌륭해요! 전체적인 위치를 잘 파악하고 있어요.':value>=55?'좋아요! 굴곡과 방향을 조금 더 세밀하게 살펴보세요.':'선을 이어 그려 보세요. 그리는 동안 정확도가 계속 바뀝니다.';
document.getElementById('msg').textContent=msg;
}
document.getElementById('clearBtn').onclick=()=>{strokes=[];current=null;redraw();document.getElementById('score').textContent='--%';document.getElementById('fill').style.width='0%';document.getElementById('msg').textContent='선을 그리면 정확도가 실시간으로 바뀝니다.';calculateScore()};
document.getElementById('retryBtn').onclick=()=>{strokes=[];current=null;redraw();document.getElementById('score').textContent='--%';document.getElementById('fill').style.width='0%';document.getElementById('msg').textContent='선을 그리면 정확도가 실시간으로 바뀝니다.';calculateScore()};
img.onload=setup;window.addEventListener('resize',setup);
</script></body></html>
